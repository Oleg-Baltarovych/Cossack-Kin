# CI (plan M0-09, .claude/rules/security.md). Hardening: every third-party action is pinned by full commit SHA
# (tag in the comment; Dependabot github-actions bumps both), read-only token by default, no
# pull_request_target, no secrets used, checkout without persisted credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full e2e incl. the @screens matrices (skipped when main had no commits in the last 24 h).
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Linux toHaveScreenshot baselines and upload them as the "screenshot-baselines" artifact (commit them by hand)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # event_name: the nightly run must not cancel (or be cancelled by) a push run on main.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build
    if: github.event_name != 'schedule' # the nightly run is the e2e matrix only
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads `packageManager` (pnpm@12.21.0) from package.json — one source of truth.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml policy applies: blocked dependency build scripts, minimumReleaseAge.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Land 1 must stay in the pacing corridor (plan M1-14/15, SPEC §2.3): fails outside src/content/pacing.ts.
      - run: pnpm balance --check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm sprites
      - run: pnpm luts
      - run: pnpm build

      # After build, so check:dist inspects the fresh dist/ (prod deps audit is blocking).
      - run: pnpm security

      # Dev dependencies also run code in CI: full audit is reported but does not block (plan M0-09).
      - name: pnpm audit (all deps, non-blocking)
        id: audit_full
        continue-on-error: true
        run: pnpm audit --audit-level high
      - name: Report full audit result
        if: steps.audit_full.outcome == 'failure'
        run: echo "::warning title=pnpm audit::high/critical advisories in dev dependencies — see the 'pnpm audit (all deps, non-blocking)' step"

  # Every push/PR: the functional e2e only (no @screens matrices, no @perf) — one job, a few minutes. The @screens
  # matrices are 225 of ~245 tests and took ~85 runner-minutes per push (private repo: limited Actions minutes);
  # they run nightly and on manual dispatch in `e2e-full` below.
  e2e:
    name: e2e (functional)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04 # pinned: screenshot baselines depend on the OS image (fonts, SwiftShader)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Ubuntu package mirrors sometimes time out while fetching Chromium's font deps (run 44522096633: apt exit
      # 100 in 2 of 6 jobs). Retry the whole install a few times before failing the job.
      - name: Install Playwright Chromium (with retries)
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning title=playwright install::attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: e2e (functional)
        run: |
          if [ -z "$(find tests/e2e/__screenshots__ -name '*.png' -print -quit 2>/dev/null)" ]; then
            pnpm e2e --grep-invert "@screens|@perf" --ignore-snapshots
          else
            pnpm e2e --grep-invert "@screens|@perf" --update-snapshots=none
          fi

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-functional
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Scheduled runs only when main moved in the last 24 h (26 h window: scheduled starts drift) (no minutes spent on a quiet day).
  recent:
    name: Commits in the last 24 h
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.log.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          persist-credentials: false
      - id: log
        run: |
          if [ -n "$(git log --since='26 hours ago' --format=%H -1)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  # Full e2e (nightly / manual dispatch): split per phone project, the 390×844 project (all @screens matrices run there) further into shards: Playwright
  # shards an ordered list, so plain --shard=N/4 gave shard 1 almost every 390-only test and it hit 30 min (run
  # 44502063892) while other shards finished in 2–4 min. Each job builds its own test bundle via playwright webServer.
  e2e-full:
    name: e2e full (${{ matrix.project }} ${{ matrix.shard }})
    needs: [recent]
    # always(): `recent` is skipped on dispatch; run on dispatch, or on schedule when main changed.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && needs.recent.outputs.changed == 'true'))
    runs-on: ubuntu-26.04 # pinned: screenshot baselines depend on the OS image (fonts, SwiftShader)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 390x844@3, shard: 1/4 }
          - { project: 390x844@3, shard: 2/4 }
          - { project: 390x844@3, shard: 3/4 }
          - { project: 390x844@3, shard: 4/4 }
          - { project: 360x800@3, shard: 1/1 }
          - { project: 412x915@3.5, shard: 1/1 }
    env:
      UPDATE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
      E2E_ARGS: --project=${{ matrix.project }} --shard=${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Ubuntu package mirrors sometimes time out while fetching Chromium's font deps (run 44522096633: apt exit
      # 100 in 2 of 6 jobs). Retry the whole install a few times before failing the job.
      - name: Install Playwright Chromium (with retries)
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning title=playwright install::attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          exit 1

      # Baselines (tests/e2e/__screenshots__/, compared on Linux only) are created by a manual run with
      # update_snapshots=true and committed by the owner. Until the first set is committed, comparisons are
      # skipped with a warning; once any baseline exists, a missing or different one fails the run.
      - name: e2e
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            pnpm e2e $E2E_ARGS --update-snapshots=all
          elif [ -z "$(find tests/e2e/__screenshots__ -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "::warning title=Screenshot baselines::none committed yet — toHaveScreenshot skipped. Run CI via workflow_dispatch with update_snapshots=true and commit the artifacts."
            pnpm e2e $E2E_ARGS --ignore-snapshots
          else
            pnpm e2e $E2E_ARGS --update-snapshots=none
          fi

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports-${{ strategy.job-index }}
          path: |
            reports/screens/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshot baselines
        if: env.UPDATE_SNAPSHOTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines-${{ strategy.job-index }}
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # gitleaks CLI from a pinned release, verified by SHA-256, instead of gitleaks/gitleaks-action: the action
    # is free for personal accounts but needs a GITLEAKS_LICENSE secret for organizations and is not MIT since
    # v2; the plain binary needs no license, no token and no third-party JS. Bump: version + checksum from
    # the release's gitleaks_<ver>_checksums.txt.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # gitleaks reads allowlists from the scanned repo; a change could hide a committed secret. `.gitleaks.toml`
      # is refused outright (M0-09). The exception file `.gitleaksignore` may only hold exact fingerprints
      # (<40-hex commit>:<path>:<rule>:<line>, one per line; empty and `#` comment lines allowed), each reviewed by
      # security-reviewer and approved by the owner; anything else (globs, extra text) fails this step.
      - name: Refuse in-repo gitleaks allowlists
        run: |
          if [ -e .gitleaks.toml ] || [ -L .gitleaks.toml ]; then
            echo "::error file=.gitleaks.toml::in-repo gitleaks config is not allowed"; exit 1
          fi
          f=.gitleaksignore
          if [ -L "$f" ] || { [ -e "$f" ] && [ ! -f "$f" ]; }; then
            echo "::error file=$f::$f must be a regular file"; exit 1
          fi
          if [ -f "$f" ]; then
            # Byte-exact, text-forced (-a: a NUL must not make grep call the file binary and print nothing).
            # Allowed lines: empty, `#` + printable ASCII, or <40-hex commit>:<path>:<rule>:<line>. No leading or
            # trailing whitespace/CR. The commit is required: gitleaks also accepts a commit-less
            # <path>:<rule>:<line> that exempts every commit, so never relax this. Path is plain [A-Za-z0-9._/-]
            # (every tracked path fits), so globs are refused. grep exit 1 = all lines valid; 2 = error (fails).
            bad=$(LC_ALL=C grep -anvE '^(#[ -~]*|[0-9a-f]{40}:[A-Za-z0-9._/-]+:[a-z0-9-]+:[0-9]+|)$' "$f") || [ $? -eq 1 ]
            if [ -n "$bad" ]; then
              printf '%s\n' "$bad" | while IFS=: read -r n _; do
                echo "::error file=$f,line=$n::only exact gitleaks fingerprints (<commit>:<path>:<rule>:<line>) are allowed"
              done
              exit 1
            fi
            echo "$f: $(LC_ALL=C grep -acE '^[0-9a-f]{40}:' "$f" || true) exact fingerprint(s)"
          fi

      # Whole history; findings are redacted in the log.
      - run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'

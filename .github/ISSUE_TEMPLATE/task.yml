name: Task
description: A unit of work from the milestone backlog (one PR)
labels: ["task"]
body:
  - type: input
    id: ref
    attributes:
      label: Milestone task / SPEC reference
      placeholder: "M2-05 · docs/SPEC.md §6.6"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, content, render, art, ui, audio, platform, tools, docs]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What and why, 1–3 lines.
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Testable, one per line. For visuals — which screenshots and what to look for.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (design, balance, out of scope)

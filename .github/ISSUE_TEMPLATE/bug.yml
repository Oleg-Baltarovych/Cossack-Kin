name: Bug
description: Something does not work as specified
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens vs. what should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS / build (or "web")
      placeholder: "Pixel 7, Android 16, 0.3.0 (12)"
  - type: textarea
    id: save
    attributes:
      label: Save export (Settings → Export), if relevant
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Screenshot / logs
